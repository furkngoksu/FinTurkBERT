# Run from the repository root. Replace model.name with your DAPT checkpoint.
model:
  name: dbmdz/bert-base-turkish-cased
  max_length: 96
  num_labels: 3
data:
  train_file: data/sentiment.jsonl
  text_column: text
  label_column: label
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
lora:
  r: 16
  lora_alpha: 32
  target_modules: [query, key, value, dense]
  lora_dropout: 0.20
  bias: none
training:
  output_dir: outputs/sentiment
  num_train_epochs: 3
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  weight_decay: 0.02
  warmup_steps: 120
  logging_steps: 50
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: f1
  greater_is_better: true
  fp16: false
  dataloader_pin_memory: false
  seed: 42
tapt_mlm:
  enabled: false
  output_dir: outputs/tapt
  num_train_epochs: 1
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 0.00003
  warmup_ratio: 0.1
  weight_decay: 0.01
  fp16: false
  seed: 42
